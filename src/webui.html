<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ANEDVD — chat</title>
<!--
  ANEDVD chat console — one self-contained file, served verbatim from GET /,
  with zero external resources: no CDN, fonts, images or frameworks. Endpoints:
  GET /v1/models, GET /health, POST /v1/chat/completions (SSE). Model output
  reaches the DOM only as text nodes or <strong>/<code> elements.
-->
<style>
  /* theme */
  :root {
    --bg: #0d1117;   --panel: #131920; --line: #262e39;
    --text: #e6edf3; --muted: #8b949e; --accent: #4c8dff;
    --user: #1e3a5f; --asst: #171d25;  --ok: #3fb950;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%;
  }
  .inner { width: 100%; max-width: 840px; margin: 0 auto; }
  button, input, textarea { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* header: brand, model chip, status dot, clear button */
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 9px 14px; }
  .bar { display: flex; align-items: center; gap: 10px; min-height: 32px; }
  .brand { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
  .chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    color: var(--muted); background: #0b0f15;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
    max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .status { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--ok);
    box-shadow: 0 0 8px rgba(63, 185, 80, 0.65); }
  .dot.bad { background: var(--danger); box-shadow: 0 0 8px rgba(255, 107, 107, 0.65); }
  /* settings row: temperature, max tokens, system prompt */
  .settings { background: #10161d; border-bottom: 1px solid var(--line); padding: 7px 14px; }
  .settings-inner { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px 18px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field.grow { flex: 1 1 220px; min-width: 160px; }
  .label { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  input[type="range"] { width: 170px; accent-color: var(--accent); }
  input[type="number"], input[type="text"] { min-width: 0; padding: 5px 8px;
    background: #0b0f15; border: 1px solid var(--line); border-radius: 8px; }
  input[type="number"] { width: 96px; }

  /* scrolling transcript */
  #log { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #list { display: flex; flex-direction: column; gap: 14px; padding: 18px 14px 10px; }
  #empty { border: 1px dashed var(--line); border-radius: 14px; padding: 16px;
    color: var(--muted); font-size: 14px; text-align: center; }
  #empty code, .body code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .row { display: flex; } .row.user { justify-content: flex-end; }
  .bubble { max-width: 86%; padding: 10px 13px; overflow-wrap: anywhere;
    background: var(--asst); border: 1px solid var(--line); border-radius: 14px;
  }
  .row.user .bubble { background: var(--user); border-color: #2f527f; border-bottom-right-radius: 5px; }
  .row.assistant .bubble { border-bottom-left-radius: 5px; }
  .row.failed .bubble { border-color: #5c2a2a; }

  /* pre-wrap renders the model's newlines without needing <br> elements */
  .body { white-space: pre-wrap; }
  .body strong { font-weight: 700; color: #ffffff; }
  .body code { font-size: 0.92em; padding: 1px 5px; background: #0b0f15;
    border: 1px solid var(--line); border-radius: 5px; }
  .error { display: block; color: var(--danger); } .muted { color: var(--muted); }
  .tag { display: block; margin-top: 5px; font-size: 11px; letter-spacing: 0.04em; color: var(--muted); }
  .pending { color: var(--muted); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .pending { animation: none; opacity: 0.7; } }
  /* composer */
  footer { background: var(--panel); border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .composer { display: flex; align-items: flex-end; gap: 8px; }
  #input { flex: 1 1 auto; resize: none; min-height: 44px; max-height: 180px; overflow-y: auto;
    padding: 11px 12px; background: #0b0f15; border: 1px solid var(--line); border-radius: 12px;
  }
  #input:disabled { opacity: 0.55; } .composer-buttons { display: flex; gap: 6px; }
  .btn { padding: 10px 14px; cursor: pointer; background: #1b2330; border: 1px solid var(--line); border-radius: 10px; }
  .btn:hover:not(:disabled) { border-color: #3a4757; }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  .btn.danger { color: var(--danger); } .btn.ghost { padding: 5px 10px; font-size: 12px; background: transparent; }
  @media (max-width: 560px) {
    .brand { display: none; }
    .chip { max-width: none; }
    .bubble { max-width: 92%; }
    .btn { padding: 10px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="inner bar">
    <span class="brand">ANEDVD</span>
    <span class="chip" id="model" title="model id from GET /v1/models">loading…</span>
    <span class="status">
      <span class="dot" id="dot" title="connection status"></span>
      <span id="status-text">connecting…</span>
    </span>
    <button type="button" id="clear" class="btn ghost">Clear chat</button>
  </div>
</header>

<section class="settings">
  <div class="inner settings-inner">
    <label class="field">
      <span class="label">temperature <output id="temp-out">0.70</output></span>
      <input type="range" id="temperature" min="0" max="1.5" step="0.05" value="0.7">
    </label>
    <label class="field">
      <span class="label">max tokens</span>
      <input type="number" id="max-tokens" min="1" max="32768" step="1" value="256">
    </label>
    <label class="field">
      <span class="label">top-p <output id="topp-out">0.90</output></span>
      <input type="range" id="top-p" min="0.05" max="1" step="0.05" value="0.9">
    </label>
    <label class="field">
      <span class="label">repeat penalty</span>
      <input type="number" id="repeat-penalty" min="1" max="2" step="0.05" value="1.15">
    </label>
    <label class="field grow">
      <span class="label">system prompt</span>
      <input type="text" id="system-prompt" autocomplete="off"
        placeholder="optional — prepended as a system message">
    </label>
  </div>
</section>

<main id="log">
  <div class="inner" id="list" role="log" aria-live="polite" aria-label="Conversation">
    <div id="empty">
      Local inference via ANEDVD; replies stream in token by token.<br>
      <code>Enter</code> sends, <code>Shift+Enter</code> adds a newline.
    </div>
  </div>
</main>

<footer>
  <form class="inner composer" id="composer">
    <textarea id="input" rows="1" autocomplete="off" spellcheck="false"
      placeholder="Message the model…"></textarea>
    <div class="composer-buttons">
      <button type="submit" id="send" class="btn primary">Send</button>
      <button type="button" id="stop" class="btn danger" disabled>Stop</button>
    </div>
  </form>
</footer>

<noscript><p style="padding: 14px; color: #ff6b6b">This page needs JavaScript.</p></noscript>

<script>
'use strict';
// Relative endpoints: the page is served from the same origin as the API.
const API_MODELS = '/v1/models';
const API_HEALTH = '/health';
const API_CHAT = '/v1/chat/completions';
const SETTINGS_KEY = 'anedvd.chat.settings.v1';
const HEALTH_INTERVAL_MS = 20000;
const MAX_TOKENS_CEILING = 32768;
const DEFAULTS = { temperature: 0.7, maxTokens: 256, systemPrompt: '', topP: 0.9, repeatPenalty: 1.15 };
const el = (id) => document.getElementById(id);
const ui = {
  log: el('log'), list: el('list'), empty: el('empty'),
  dot: el('dot'), statusText: el('status-text'), model: el('model'), clear: el('clear'),
  composer: el('composer'), input: el('input'), send: el('send'), stop: el('stop'),
  temperature: el('temperature'), tempOut: el('temp-out'),
  maxTokens: el('max-tokens'), systemPrompt: el('system-prompt'),
  topP: el('top-p'), topPOut: el('topp-out'), repeatPenalty: el('repeat-penalty'),
};
// `messages` is the transcript replayed to the server; the DOM is only a view.
const state = { model: '', messages: [], generating: false, controller: null, pinned: true, cleared: false, droppedTokens: 0 };
const settings = Object.assign({}, DEFAULTS);

// --- settings persistence (localStorage can throw in private mode) ----------
function clampTemperature(value) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.min(1.5, Math.max(0, n)) : DEFAULTS.temperature;
}
function clampTokens(value) {
  const n = parseInt(value, 10);
  return Number.isFinite(n) && n >= 1 ? Math.min(MAX_TOKENS_CEILING, n) : DEFAULTS.maxTokens;
}
function clampTopP(value) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.min(1, Math.max(0.05, n)) : DEFAULTS.topP;
}
function clampRepeatPenalty(value) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.min(2, Math.max(1, n)) : DEFAULTS.repeatPenalty;
}
function loadSettings() {
  let raw = null;
  try { raw = localStorage.getItem(SETTINGS_KEY); } catch (err) { raw = null; }
  if (raw) {
    try {
      const saved = JSON.parse(raw);
      if (saved && typeof saved === 'object') Object.assign(settings, saved);
    } catch (err) { /* corrupt entry: keep the defaults */ }
  }
  settings.temperature = clampTemperature(settings.temperature);
  settings.maxTokens = clampTokens(settings.maxTokens);
  settings.topP = clampTopP(settings.topP);
  settings.repeatPenalty = clampRepeatPenalty(settings.repeatPenalty);
  if (typeof settings.systemPrompt !== 'string') settings.systemPrompt = '';
}
function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (err) { /* ignore */ }
}
function settingsToForm() {
  ui.temperature.value = String(settings.temperature);
  ui.tempOut.textContent = settings.temperature.toFixed(2);
  ui.maxTokens.value = String(settings.maxTokens);
  ui.topP.value = String(settings.topP);
  ui.topPOut.textContent = settings.topP.toFixed(2);
  ui.repeatPenalty.value = String(settings.repeatPenalty);
  ui.systemPrompt.value = settings.systemPrompt;
}
function wireSettings() {
  ui.temperature.addEventListener('input', () => {
    settings.temperature = clampTemperature(ui.temperature.value);
    ui.tempOut.textContent = settings.temperature.toFixed(2);
    saveSettings();
  });
  // Track keystrokes, but only normalise the visible field on blur/change:
  // rewriting a number input mid-typing is hostile.
  ui.maxTokens.addEventListener('input', () => {
    settings.maxTokens = clampTokens(ui.maxTokens.value);
    saveSettings();
  });
  ui.maxTokens.addEventListener('change', () => {
    settings.maxTokens = clampTokens(ui.maxTokens.value);
    ui.maxTokens.value = String(settings.maxTokens);
    saveSettings();
  });
  ui.topP.addEventListener('input', () => {
    settings.topP = clampTopP(ui.topP.value);
    ui.topPOut.textContent = settings.topP.toFixed(2);
    saveSettings();
  });
  ui.repeatPenalty.addEventListener('input', () => {
    settings.repeatPenalty = clampRepeatPenalty(ui.repeatPenalty.value);
    saveSettings();
  });
  ui.repeatPenalty.addEventListener('change', () => {
    settings.repeatPenalty = clampRepeatPenalty(ui.repeatPenalty.value);
    ui.repeatPenalty.value = String(settings.repeatPenalty);
    saveSettings();
  });
  ui.systemPrompt.addEventListener('input', () => {
    settings.systemPrompt = ui.systemPrompt.value;
    saveSettings();
  });
}

// --- header: status dot + model id ------------------------------------------
function setStatus(ok, text) {
  ui.dot.classList.toggle('bad', !ok);
  ui.dot.title = text || (ok ? 'connected' : 'request failed');
  ui.statusText.textContent = text || (ok ? 'online' : 'error');
}
async function checkHealth() {
  if (state.generating) return;
  try {
    const res = await fetch(API_HEALTH, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json().catch(() => ({}));
    if (data && data.status && data.status !== 'ok') throw new Error('status ' + data.status);
    setStatus(true, 'online');
  } catch (err) {
    setStatus(false, 'offline');
  }
}
async function loadModel() {
  try {
    const res = await fetch(API_MODELS, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const first = data && Array.isArray(data.data) ? data.data[0] : null;
    state.model = first && first.id ? String(first.id) : '';
    ui.model.textContent = state.model || 'no model';
  } catch (err) {
    state.model = '';
    ui.model.textContent = 'no model';
    setStatus(false, 'models unavailable');
  }
}

// --- safe renderer ----------------------------------------------------------
// Turns **bold** and `code` into elements; every other byte is a text node, so
// a reply containing markup is displayed literally instead of being parsed.
const RICH_RE = /\*\*([^*\n]+)\*\*|`([^`\n]+)`/g;
function renderRich(target, text) {
  target.textContent = '';
  const source = String(text == null ? '' : text);
  let last = 0;
  let match;
  RICH_RE.lastIndex = 0;
  while ((match = RICH_RE.exec(source)) !== null) {
    if (match.index > last) {
      target.appendChild(document.createTextNode(source.slice(last, match.index)));
    }
    const node = document.createElement(match[1] !== undefined ? 'strong' : 'code');
    node.textContent = match[1] !== undefined ? match[1] : match[2];
    target.appendChild(node);
    last = RICH_RE.lastIndex;
  }
  if (last < source.length) {
    target.appendChild(document.createTextNode(source.slice(last)));
  }
}

// --- transcript -------------------------------------------------------------
function updateEmptyHint() {
  ui.empty.hidden = ui.list.querySelector('.row') !== null;
}
function addBubble(role, text) {
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  const body = document.createElement('div');
  body.className = 'body';
  bubble.appendChild(body);
  row.appendChild(bubble);
  ui.list.appendChild(row);
  if (text !== undefined) renderRich(body, text);
  updateEmptyHint();
  return { row: row, bubble: bubble, body: body };
}
function addMuted(body, text) {
  const span = document.createElement('span');
  span.className = 'muted';
  span.textContent = text;
  body.textContent = '';
  body.appendChild(span);
}
function failBubble(view, partial, message) {
  view.body.textContent = '';
  if (partial) renderRich(view.body, partial);
  const error = document.createElement('span');
  error.className = 'error';
  error.textContent = (partial ? 'stream failed: ' : '') + message;
  view.body.appendChild(error);
  view.row.classList.add('failed');
  setStatus(false, message);
  scrollToEnd(true);
}

// --- auto-scroll: follow the newest text, never fight the user ---------------
function atBottom() {
  return ui.log.scrollHeight - ui.log.scrollTop - ui.log.clientHeight < 64;
}
function scrollToEnd(force) {
  if (force) state.pinned = true;
  if (state.pinned) ui.log.scrollTop = ui.log.scrollHeight;
}

// --- SSE reader -------------------------------------------------------------
// Decoded text is buffered and cut only on a blank line, so a `data:` line that
// a network chunk split in half is reassembled before it is parsed.
async function readStream(body, onDelta) {
  const reader = body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let sawDone = false;
  for (;;) {
    const chunk = await reader.read();
    if (chunk.done) break;
    buffer += decoder.decode(chunk.value, { stream: true });
    buffer = buffer.replace(/\r\n/g, '\n');
    let cut;
    while ((cut = buffer.indexOf('\n\n')) !== -1) {
      const event = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      if (handleEvent(event, onDelta)) { sawDone = true; break; }
    }
    if (sawDone) {
      try { await reader.cancel(); } catch (err) { /* already closed */ }
      break;
    }
  }
  // Flush the decoder; some servers close without a trailing blank line.
  buffer += decoder.decode();
  if (!sawDone && buffer.trim() !== '') handleEvent(buffer, onDelta);
}
// Returns true once the [DONE] sentinel is seen.
function handleEvent(raw, onDelta) {
  const lines = raw.split('\n');
  for (let i = 0; i < lines.length; i += 1) {
    const line = lines[i].trim();
    if (line === '' || line.charAt(0) === ':') continue;    // keep-alive comment
    if (line.indexOf('data:') !== 0) continue;
    const payload = line.slice(5).trim();
    if (payload === '[DONE]') return true;
    if (payload === '') continue;
    let parsed;
    try { parsed = JSON.parse(payload); } catch (err) { continue; }
    const choice = parsed && Array.isArray(parsed.choices) ? parsed.choices[0] : null;
    const delta = choice ? choice.delta : null;
    if (delta && typeof delta.content === 'string' && delta.content !== '') onDelta(delta.content);
    // The server reports dropped prompt tokens in the final chunk's usage; a
    // truncated context must be visible, not silently produce a shorter answer.
    if (parsed && parsed.usage && Number(parsed.usage.prompt_tokens_dropped) > 0) {
      state.droppedTokens = Number(parsed.usage.prompt_tokens_dropped);
    }
  }
  return false;
}

// --- generation -------------------------------------------------------------
function buildRequestMessages() {
  const out = [];
  const system = settings.systemPrompt.trim();
  if (system !== '') out.push({ role: 'system', content: system });
  for (let i = 0; i < state.messages.length; i += 1) {
    out.push({ role: state.messages[i].role, content: state.messages[i].content });
  }
  return out;
}
function reportTruncation() {
  if (state.droppedTokens > 0) {
    setStatus(false, 'context truncated: the oldest ' + state.droppedTokens +
      ' prompt tokens were dropped to fit the model\u2019s window');
  }
}
function setGenerating(on) {
  state.generating = on;
  ui.input.disabled = on;
  ui.send.disabled = on;
  ui.stop.disabled = !on;
  if (on) {
    state.pinned = true;
  } else {
    state.controller = null;
    ui.input.focus();
  }
}
async function send() {
  const text = ui.input.value.trim();
  if (text === '' || state.generating) return;
  ui.input.value = '';
  resizeInput();
  state.messages.push({ role: 'user', content: text });
  addBubble('user', text);
  const view = addBubble('assistant');
  const pending = document.createElement('span');
  pending.className = 'pending';
  pending.textContent = 'thinking…';
  view.body.appendChild(pending);
  scrollToEnd(true);
  const controller = new AbortController();
  state.controller = controller;
  setGenerating(true);
  setStatus(true, 'streaming…');
  let answer = '';
  let flushed = false;
  let frameQueued = false;
  const paint = () => {
    if (!flushed) { view.body.textContent = ''; flushed = true; }
    renderRich(view.body, answer);
    scrollToEnd(false);
  };
  // Repainting per delta is fine at these sizes; coalescing into an animation
  // frame keeps it off the layout path when chunks arrive in bursts.
  const schedulePaint = () => {
    if (frameQueued) return;
    frameQueued = true;
    requestAnimationFrame(() => { frameQueued = false; paint(); });
  };
  try {
    const res = await fetch(API_CHAT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: controller.signal,
      body: JSON.stringify({
        model: state.model,
        messages: buildRequestMessages(),
        temperature: settings.temperature,
        max_tokens: settings.maxTokens,
        top_p: settings.topP,
        repetition_penalty: settings.repeatPenalty,
        stream: true,
      }),
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => '');
      // The server refuses a second generation while one is running (503) with a
      // JSON body. Show its message rather than the raw JSON.
      let msg = '';
      try {
        const parsed = JSON.parse(detail);
        msg = (parsed && parsed.error && parsed.error.message) || '';
      } catch (e) {
        msg = detail.slice(0, 300);
      }
      if (res.status === 503) {
        msg = (msg || 'the server is busy') + ' — try again in a moment.';
      }
      throw new Error(msg || ('HTTP ' + res.status + (res.statusText ? ' ' + res.statusText : '')));
    }
    const contentType = (res.headers.get('content-type') || '').toLowerCase();
    if (res.body && contentType.indexOf('application/json') === -1) {
      // Event stream, or an unlabelled body we can still parse as SSE.
      state.droppedTokens = 0;
      await readStream(res.body, (delta) => { answer += delta; schedulePaint(); });
    } else {
      // Non-streaming fallback: a plain chat.completion object.
      const data = await res.json();
      const choice = data && Array.isArray(data.choices) ? data.choices[0] : null;
      const content = choice && choice.message ? choice.message.content : '';
      if (typeof content === 'string') answer = content;
      paint();
    }
    if (answer === '') {
      addMuted(view.body, '(empty response)');
    } else {
      paint();
      state.messages.push({ role: 'assistant', content: answer });
    }
    setStatus(true, 'online');
  } catch (err) {
    if (controller.signal.aborted) {
      // Stop pressed: keep the text that already arrived and label it.
      if (answer !== '' && !state.cleared) {
        paint();
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = 'stopped';
        view.bubble.appendChild(tag);
        state.messages.push({ role: 'assistant', content: answer });
      } else {
        addMuted(view.body, '(stopped before any text arrived)');
      }
      setStatus(true, 'stopped');
    } else {
      if (answer !== '' && !state.cleared) state.messages.push({ role: 'assistant', content: answer });
      failBubble(view, answer, err && err.message ? String(err.message) : String(err));
    }
  } finally {
    state.cleared = false;
    setGenerating(false);
    reportTruncation();
    scrollToEnd(false);
  }
}

// --- composer + transcript actions ------------------------------------------
function resizeInput() {
  ui.input.style.height = 'auto';   // reset first, or the box can only ever grow
  ui.input.style.height = Math.min(ui.input.scrollHeight, 180) + 'px';
}
function clearChat() {
  if (state.controller) state.controller.abort();
  state.cleared = true;   // a reply still in flight must not enter the transcript
  const rows = ui.list.querySelectorAll('.row');
  for (let i = 0; i < rows.length; i += 1) rows[i].remove();
  state.messages = [];
  updateEmptyHint();
  scrollToEnd(true);
}
function wireComposer() {
  ui.composer.addEventListener('submit', (ev) => {
    ev.preventDefault();
    send();
  });
  ui.input.addEventListener('keydown', (ev) => {
    // Enter sends, Shift+Enter inserts a newline; skip while an IME is
    // composing so Enter can still confirm candidate characters.
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
      ev.preventDefault();
      send();
    }
  });
  ui.input.addEventListener('input', resizeInput);
  ui.stop.addEventListener('click', () => { if (state.controller) state.controller.abort(); });
  ui.clear.addEventListener('click', clearChat);
  ui.log.addEventListener('scroll', () => { state.pinned = atBottom(); }, { passive: true });
}

// --- boot -------------------------------------------------------------------
async function boot() {
  loadSettings();
  settingsToForm();
  wireSettings();
  wireComposer();
  resizeInput();
  await checkHealth();
  await loadModel();
  setInterval(checkHealth, HEALTH_INTERVAL_MS);   // cheap liveness refresh
  ui.input.focus();
}
boot();
</script>
